name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: C# checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize managed dependencies
        run: git submodule update --init External/SonicAudioTools External/vgaudio
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore PenguinTools.slnx
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/tools
          key: native-tools-${{ runner.os }}-${{ hashFiles('PenguinTools.Assets/native-tools.json') }}
      - name: Verify C# formatting and style
        run: ./scripts/check-style.ps1
      - run: dotnet build PenguinTools.slnx -c Release --no-restore -p:Platform=x64 -warnaserror
      - run: dotnet test --project PenguinTools.Tests/PenguinTools.Tests.csproj -c Release --no-build --results-directory TestResults --report-xunit-trx
      - name: Publish CLI
        shell: pwsh
        run: |
          foreach ($profile in @('WinX64', 'WinX64-NativeAOT')) {
            dotnet publish PenguinTools.CLI/PenguinTools.CLI.csproj -p:PublishProfile=$profile -p:DebugType=None -p:DebugSymbols=false

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
