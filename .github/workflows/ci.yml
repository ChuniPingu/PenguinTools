name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: C# checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Initialize managed dependencies
        run: git submodule update --init External/SonicAudioTools External/vgaudio
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore PenguinTools.slnx
      - name: Verify C# formatting and style
        run: ./scripts/check-style.ps1
      - run: dotnet build PenguinTools.slnx -c Release --no-restore -p:Platform=x64 -warnaserror
      - run: dotnet test --project PenguinTools.Tests/PenguinTools.Tests.csproj -c Release --no-build --results-directory TestResults --report-xunit-trx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
